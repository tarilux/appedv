<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP Projets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar p-3 text-light">
    <h4>ERP Interne</h4>
    <a href="/">Dashboard</a>
    <a href="/projects/">Projets</a>
    <a href="/projects/new/">Nouveau projet</a>
    <a href="/archive/">Archive</a>
    <a href="/history/">Historique</a>
    <hr/>
    <a href="/export/projects.xlsx">Export Excel</a>
    <a href="/export/projects.pdf">Export PDF</a>
    <a href="/export/projects.pptx">Export PowerPoint</a>
  </aside>
  <main class="content p-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
