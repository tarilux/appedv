{% extends 'base.html' %}
{% block content %}
<div class="card-panel">
  <form method="post" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
    <div class="col-md-6">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
    </div>
    {% endfor %}
    <div class="col-12"><button class="btn btn-primary">Enregistrer</button></div>
  </form>
</div>
{% endblock %}
